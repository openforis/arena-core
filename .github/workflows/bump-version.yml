name: Arena Core

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - 'package.json'

# never run two releases at the same time: merges close together would interleave version bumps, tags and publishing
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish-new-version:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
      - name: Temporarily disable "include administrators" branch protection
        uses: ./.github/actions/toggle-branch-protection
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          enforce_admins: 'false'
          branch: ${{ github.ref_name }}
      - name: 'Automated Version Bump'
        uses: phips28/gh-action-bump-version@63bc5b97aade4390bf3f33416b8adb891a0f28d7 # v12.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        with:
          tag-prefix: 'v'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@openforis'
      # -----------------------------------------------
      # This step calls the composite action
      # to create the `.yarnrc.yml` in the workflow
      - name: Setup .yarnrc.yml
        uses: ./.github/actions/setup-yarnrc
        with:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      # -----------------------------------------------
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn build
      - name: Publish to GitHub Packages
        run: yarn npm publish
      # npmjs: drop the GitHub-specific registry config (.npmrc scope mapping and publishConfig) before publishing
      - name: Publish to npmjs
        run: |
          rm -f .npmrc
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmjs.npmrc"
          npm publish --registry https://registry.npmjs.org/ --access public --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Enable "include administrators" branch protection
        if: always() # Force to always run this step to ensure "include administrators" is always turned back on
        uses: ./.github/actions/toggle-branch-protection
        with:
          token: ${{ secrets.ACCESS_TOKEN }}
          enforce_admins: 'true'
          branch: ${{ github.ref_name }}
