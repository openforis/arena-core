name: 'Publish package'

# publishes the package to GitHub Packages and npmjs when a version tag is pushed (by release.yml).
# The two registries are published by independent jobs: if one fails, use "Re-run failed jobs".
# Every publish job is skipped when the version is already in its registry, so the whole workflow can be re-run too;
# it can also be started manually on an existing v* tag (Run workflow > Use workflow from: tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn test

  # the prepack script builds dist/ and disables the postinstall script (husky) in the published package.json
  publish-github-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      # NOTE: the GitHub Packages token is read by .yarnrc.yml (npmScopes.openforis.npmAuthToken)
      - name: Publish to GitHub Packages
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sSf -H "Authorization: Bearer ${NPM_TOKEN}" https://npm.pkg.github.com/@openforis%2farena-core \
            | jq -e --arg version "$VERSION" '.versions[$version]' > /dev/null; then
            echo "::notice::version $VERSION already published to GitHub Packages: skipped"
          else
            yarn npm publish
          fi
        env:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}

  publish-npmjs:
    needs: test
    runs-on: ubuntu-latest
    # id-token: npm trusted publishing and provenance authenticate the workflow run with an OIDC token
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      # drop the GitHub-specific registry config (.npmrc scope mapping and publishConfig) before publishing.
      # --provenance links the published version to this workflow run and commit.
      # npm authenticates with the trusted publisher (OIDC) configured for this workflow file (publish.yml)
      # on npmjs.com, whose allowed actions must include "npm publish": no npm token is used.
      - name: Publish to npmjs
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if curl -sf -o /dev/null "https://registry.npmjs.org/@openforis%2farena-core/${VERSION}"; then
            echo "::notice::version $VERSION already published to npmjs: skipped"
            exit 0
          fi
          rm -f .npmrc
          npm pkg delete publishConfig
          npm publish --registry https://registry.npmjs.org/ --access public --provenance
