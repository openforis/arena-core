name: 'Publish package'

# publishes the package to GitHub Packages and npmjs when a version tag is pushed (by release.yml).
# If publishing fails, this workflow can be re-run without bumping the version again;
# it can also be started manually on an existing v* tag (Run workflow > Use workflow from: tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

# id-token: npm provenance (and npm trusted publishing) authenticate the workflow run with an OIDC token
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn test
      # the prepack script builds dist/ and disables the postinstall script (husky) in the published package.json
      # NOTE: the GitHub Packages token is read by .yarnrc.yml (npmScopes.openforis.npmAuthToken)
      - name: Publish to GitHub Packages
        run: yarn npm publish
        env:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      # npmjs: drop the GitHub-specific registry config (.npmrc scope mapping and publishConfig) before publishing.
      # --provenance links the published version to this workflow run and commit.
      # When npm trusted publishing is configured for this workflow on npmjs.com, npm authenticates with OIDC
      # and the NPM_TOKEN secret is not needed anymore (it is only used as fallback).
      - name: Publish to npmjs
        run: |
          rm -f .npmrc
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmjs.npmrc"
          npm publish --registry https://registry.npmjs.org/ --access public --provenance --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
