name: 'Publish package'

# publishes the package to GitHub Packages and npmjs when a version tag is pushed (by release.yml).
# If publishing fails, this workflow can be re-run without bumping the version again;
# it can also be started manually on an existing v* tag (Run workflow > Use workflow from: tag).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com/
          scope: '@openforis'
      # -----------------------------------------------
      # This step calls the composite action
      # to create the `.yarnrc.yml` in the workflow
      - name: Setup .yarnrc.yml
        uses: ./.github/actions/setup-yarnrc
        with:
          NPM_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      # -----------------------------------------------
      - name: Install dependencies
        run: yarn install --immutable --mode=skip-build
      - run: yarn build
      - run: yarn test
      - name: Publish to GitHub Packages
        run: yarn npm publish
      # npmjs: drop the GitHub-specific registry config (.npmrc scope mapping and publishConfig) before publishing
      - name: Publish to npmjs
        run: |
          rm -f .npmrc
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmjs.npmrc"
          npm publish --registry https://registry.npmjs.org/ --access public --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
