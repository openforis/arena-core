# Runs tests and then publishes the package to both GitHub Packages and npmjs when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: yarn install --immutable --mode=skip-build
      - run: yarn test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: yarn install --immutable --mode=skip-build
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: yarn build

      # GitHub Packages: registry and auth come from .yarnrc.yml (npmScopes.openforis) and package.json publishConfig
      - name: Publish to GitHub Packages
        run: yarn npm publish
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # npmjs: drop the GitHub-specific registry config (.npmrc scope mapping and publishConfig) before publishing
      - name: Publish to npmjs
        run: |
          rm -f .npmrc
          npm pkg delete publishConfig
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$RUNNER_TEMP/npmjs.npmrc"
          npm publish --registry https://registry.npmjs.org/ --access public --userconfig "$RUNNER_TEMP/npmjs.npmrc"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
