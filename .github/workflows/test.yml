name: Run yarn test

on: [pull_request]

jobs:
  # NOTE: job id "build" is referenced by Mergify
  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{secrets.ACCESS_TOKEN}}
    steps:
      - uses: actions/checkout@v5

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: yarn install --immutable --mode=skip-build
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test
