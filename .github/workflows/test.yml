name: Run yarn test

on: [pull_request]

jobs:
  # NOTE: job id "build" is referenced by Mergify
  build:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{secrets.ACCESS_TOKEN}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: yarn install --immutable --mode=skip-build
      - run: yarn lint
      - run: yarn format:check
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test

  # the tests run in UTC by default (see jest.config.ts): run them also in time zones east and west of UTC
  # to catch date handling that depends on the local time zone
  test-timezones:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: ['Asia/Tokyo', 'America/New_York']
    env:
      NPM_TOKEN: ${{secrets.ACCESS_TOKEN}}
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - run: yarn install --immutable --mode=skip-build
      - run: yarn test
