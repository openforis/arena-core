name: 'Toggle branch protection "include administrators"'
description: 'Enables or disables the "include administrators" (enforce_admins) branch protection setting, tolerating a 404 when the branch is already in the desired state.'
inputs:
  token:
    description: 'GitHub token with permission to manage branch protection.'
    required: true
  enforce_admins:
    description: 'Whether to enable ("true") or disable ("false") enforce_admins.'
    required: true
  branch:
    description: 'Branch to update.'
    required: false
    default: 'master'
runs:
  using: 'composite'
  steps:
    - name: Toggle enforce_admins
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        METHOD: ${{ inputs.enforce_admins == 'true' && 'POST' || 'DELETE' }}
      run: |
        if ! output=$(gh api -X "$METHOD" repos/${{ github.repository }}/branches/${{ inputs.branch }}/protection/enforce_admins 2>&1); then
          if echo "$output" | grep -q 'HTTP 404'; then
            echo "Branch protection already in desired state (404), continuing"
          else
            echo "$output" >&2
            exit 1
          fi
        fi
